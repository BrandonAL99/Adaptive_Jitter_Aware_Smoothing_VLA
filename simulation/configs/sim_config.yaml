# Simulation configuration
# Adjust these values to match your physical setup measurements.

robot:
  # Joint names must match the URDF exactly
  joint_names:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  # Control frequency (Hz) — how often actions are sent
  control_hz: 30
  # Steps per action (mujoco timestep=0.002s, so 30Hz = ~17 steps/action)
  sim_steps_per_action: 17

cameras:
  top:
    name: camera_overhead
    width: 224
    height: 224
    fovy: 55
    # World-frame position and euler angles (radians)
    pos: [0.0, 0.0, 1.4]
    euler: [0.0, 0.0, 0.0]
  wrist:
    name: camera_wrist
    width: 224
    height: 224
    fovy: 80
    # Update these once robot MJCF is added (attach to end-effector body)
    pos: [0.2, 0.0, 0.95]
    euler: [0.0, 1.2, 0.0]

table:
  # Approximate physical measurements (metres)
  surface_height: 0.81      # z of table top face
  width: 1.1
  depth: 0.76

workspace:
  # Mat centre relative to robot base
  mat_radius: 0.18
  mat_centre: [0.0, 0.0]   # XY relative to robot base

cubes:
  side_length: 0.03         # ~3cm cubes
  mass_kg: 0.05

boxes:
  # Physical cardboard boxes at base of robot on right side
  inner_size: [0.09, 0.07, 0.05]   # width, depth, height (m)
  wall_thickness: 0.005

tasks:
  pick_place:
    scene_xml: pick_place.xml
    max_episode_steps: 300
  stacking:
    scene_xml: stacking.xml
    max_episode_steps: 400
  sorting:
    scene_xml: sorting.xml
    max_episode_steps: 500
